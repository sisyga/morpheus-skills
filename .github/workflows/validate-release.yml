name: Validate release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build lean release
        run: python3 build_release.py --output /tmp/morpheus.zip

      - name: Validate release contents
        run: python3 validate_release.py /tmp/morpheus.zip --profile lean

      - name: Validate Python syntax
        run: python3 -m py_compile build_release.py validate_release.py
